<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homeroom — family courses & sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F8;--surface:#fff;--surface2:#F6F8FB;--ink:#15202B;--muted:#5B6776;--line:#E1E6ED;--brand:#20395B;--brand-ink:#fff;--ok:#1E7A4E;--warn:#95600A;--bad:#B3352A;--info:#2A5DA8;--shadow:0 1px 2px rgba(20,32,50,.06),0 6px 20px rgba(20,32,50,.05);
--font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151D;--surface:#16202B;--surface2:#1B2733;--ink:#EAF0F6;--muted:#9AA8B8;--line:#2A3745;--brand:#8DB4EA;--brand-ink:#0E151D;--ok:#5CC994;--warn:#E3B05A;--bad:#F07A6E;--info:#7FB0F0;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0E151D;--surface:#16202B;--surface2:#1B2733;--ink:#EAF0F6;--muted:#9AA8B8;--line:#2A3745;--brand:#8DB4EA;--brand-ink:#0E151D;--ok:#5CC994;--warn:#E3B05A;--bad:#F07A6E;--info:#7FB0F0;--shadow:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:26px}h2{font-size:19px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:600}
.ic{flex:none;vertical-align:-3px}
.app{min-height:100vh;display:flex}
.side{display:none;width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;flex-direction:column;gap:4px}
.brand{font-family:var(--head);font-weight:700;font-size:22px;padding:2px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:9px;background:conic-gradient(var(--c1) 0 33%,var(--c2) 0 66%,var(--c3) 0);display:inline-block}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;width:100%;color:var(--muted);font-weight:600}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--brand);color:var(--brand-ink)}
.main{flex:1;min-width:0;padding:16px 16px 96px}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.viewas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.viewas select{max-width:190px}
select,input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
@media(max-width:700px){select,input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],textarea{font-size:16px}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
.bnav button.on{color:var(--brand)}
@media(min-width:900px){.side{display:flex}.bnav{display:none}.main{padding:28px 32px 48px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.qa{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -2px}
.qa .btn{flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px;border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.avatar{width:var(--s,28px);height:var(--s,28px);border-radius:50%;background:var(--pc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s,28px)*.42);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 30%,var(--surface))}
.st-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface));border-color:color-mix(in srgb,var(--bad) 30%,var(--surface))}
.st-warn,.st-pend{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,var(--surface));border-color:color-mix(in srgb,var(--warn) 32%,var(--surface))}
.st-up{color:var(--info);background:color-mix(in srgb,var(--info) 11%,var(--surface));border-color:color-mix(in srgb,var(--info) 28%,var(--surface))}
.st-can{color:var(--muted)}.st-res{color:#7A4FB0;background:color-mix(in srgb,#7A4FB0 11%,var(--surface));border-color:color-mix(in srgb,#7A4FB0 28%,var(--surface))}
.scard{display:flex;gap:11px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 0;overflow:hidden;position:relative;margin-bottom:8px}
.scard:hover{border-color:var(--muted)}
.scard .bar{width:6px;align-self:stretch;background:var(--bar);border-radius:0 6px 6px 0;flex:none}
.scard .bd{flex:1;min-width:0}
.scard .t1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.scard .nm{font-weight:700}
.scard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;margin-top:3px}
.scard .meta span{display:inline-flex;align-items:center;gap:4px}
.scard.dim{opacity:.62}.scard.dim .nm,.scard.dim .tm{text-decoration:line-through}
.scard.tint{background:color-mix(in srgb,var(--pc) 8%,var(--surface))}
.prep{margin-top:7px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:10px;padding:7px 10px;font-size:13px;border-left:3px solid var(--warn)}
.prep b{font-weight:700}
.dayh{font-family:var(--head);font-weight:700;margin:14px 0 8px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.dayh small{font-family:var(--font);font-weight:500;color:var(--muted)}
.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px;border:1px solid}
.banner.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.banner.bad{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 35%,var(--surface))}
.banner.info{background:color-mix(in srgb,var(--info) 9%,var(--surface));border-color:color-mix(in srgb,var(--info) 30%,var(--surface))}
.banner ul{margin:4px 0 0 16px;padding:0}
.prog{height:9px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pc,var(--brand));border-radius:9px}
.prog.lvl-due i{background:var(--bad)}.prog.lvl-urgent i{background:var(--warn)}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;gap:10px;align-items:center;padding:10px 0}
.li .grow{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.bad{background:var(--bad);color:#fff}
.att{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;flex-wrap:wrap}
.att .who{display:flex;align-items:center;gap:8px}
.ov{position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.top2{z-index:70}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet.wide{max-width:760px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.x{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none}
details.dt{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--surface)}
details.dt>summary{padding:11px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.dt[open]>summary::after{transform:rotate(-135deg)}
details.dt>.in{padding:2px 14px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:90;font-weight:600;font-size:14px;max-width:90vw;box-shadow:var(--shadow)}
.toast.warn{background:var(--warn);color:#fff}
.wk{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:900px){.wk{grid-template-columns:repeat(7,1fr)}.wk .scard{padding-right:8px}.wk .loc{display:none}}
.wkcol{min-width:0}
.wkcol .dayh{margin-top:0}
.wkcol.today .dayh{color:var(--info)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mg .hd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.mcell{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:58px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px}
@media(min-width:760px){.mcell{min-height:92px}}
.mcell.dim{opacity:.5}.mcell.today{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}.mcell.sel{background:var(--surface2)}
.mcell .dn{font-weight:700;font-size:13px}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.pill{font-size:11px;font-weight:600;border-radius:6px;padding:1px 5px;background:color-mix(in srgb,var(--pc) 16%,var(--surface));border-left:3px solid var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:none}
@media(min-width:760px){.pill{display:block}.dots .dot{display:none}.dots .dot.more{display:inline-block}}
.pgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.hbar .lb{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:12px;background:var(--surface2);border-radius:8px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--pc,var(--brand));border-radius:8px}
.hbar .vl{width:84px;text-align:right;font-weight:600}
.big{font-family:var(--head);font-size:34px;font-weight:700;line-height:1}
.hero{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.hero .sub{color:var(--muted)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{width:34px;height:34px;border-radius:50%;background:var(--pc);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.sw input{position:absolute;opacity:0}
.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{text-align:left;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:10px 0;font-size:14px}
.rate{display:inline-flex;gap:2px}.rate i{width:9px;height:9px;border-radius:50%;background:var(--line)}.rate i.on{background:var(--ok)}
.fbk{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;background:var(--surface2)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--c1:#8A4DB8;--c2:#0E8C80;--c3:#D9662B}
.qm{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.hhsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hhsel select{max-width:160px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding:4px 2px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--brand) 14%,var(--surface));border-color:color-mix(in srgb,var(--brand) 30%,var(--surface))}
.msg .who{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
.busytl{display:flex;height:26px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.busytl i{display:block;height:100%}
.busytl i.busy{background:var(--bad)}
.busytl i.free{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}
.stepper{display:flex;gap:5px;margin:10px 0}
.stepper i{height:5px;flex:1;border-radius:4px;background:var(--line)}
.stepper i.on{background:var(--brand)}
.topline{display:flex;gap:8px;align-items:center}
.priv{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.welcome .card{width:100%;max-width:560px;padding:28px 24px}
.welcome h1{font-size:30px;margin:14px 0 8px}
.welcome .lead{color:var(--muted);font-size:16px;margin:0 0 22px;line-height:1.5}
.welcome .choices{display:flex;flex-direction:column;gap:10px}
.welcome .choices .btn{justify-content:center;padding:13px 16px;font-size:15px}
.mrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.sw.sm label{width:26px;height:26px}.sw.sm input:checked+span{width:26px;height:26px}
.onb-course .adv{display:none!important}
.gmember{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:13px}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
'use strict';
/* =====================================================================
   HOMEROOM — prototype. Layers: utils → store → business logic → permissions → actions → views.
   All money/session math lives in the "business logic" section; views only call it.
   Storage is isolated in persist()/loadState() so a real backend can replace it.
   ===================================================================== */

/* ---------- utils ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const tmin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const minT=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const fmtT=t=>{let [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${pad(m)} ${ap}`};
const fmtD=(s,o)=>parseD(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const fmtDL=s=>{const t=today();if(s===t)return 'Today';if(s===addDays(t,1))return 'Tomorrow';if(s===addDays(t,-1))return 'Yesterday';return fmtD(s)};
const dow=s=>parseD(s).getDay();
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const money=n=>Math.round(n).toLocaleString('en-US')+' '+cur();

function statusKey(s,pid){
  if(s.status==='completed'){
    const ps=pid?s.participants.filter(p=>p.personId===pid):s.participants;
    const a=ps.filter(p=>p.attendance==='attended').length,b=ps.filter(p=>p.attendance==='absent').length;
    if(a&&!b)return 'completed_attended';if(b&&!a)return 'completed_absent';return (a||b)?'completed_mixed':'completed';
  }

}
const ST={upcoming:['Upcoming','st-up'],completed:['Completed','st-ok'],completed_attended:['Completed — Attended','st-ok'],completed_absent:['Completed — Absent','st-bad'],completed_mixed:['Completed — Mixed','st-ok'],cancelled_teacher:['Cancelled by teacher','st-can'],cancelled_family:['Cancelled by family','st-can'],rescheduled:['Rescheduled','st-res'],pending_reschedule:['Pending reschedule','st-pend']};

/* ShouldSessionDeductFromPackage */
function shouldDeduct(s,part){
  const c=course(s.courseId);
  if(!isPaid(c))return {deduct:false,reason:'Free activity — no package involved.'};
  if(s.status!=='completed'){
    const r={upcoming:'Not held yet — nothing deducted.',cancelled_teacher:'Cancelled by the teacher — not deducted.',cancelled_family:'Cancelled by the family — not deducted.',rescheduled:'Rescheduled — the entitlement moved to the replacement session'+(s.replacedById&&sess(s.replacedById)?' on '+fmtD(sess(s.replacedById).date):'')+'.',pending_reschedule:'Waiting for a make-up date — not deducted.'};
    return {deduct:false,reason:r[s.status]||'Not deducted.'};
  }
  if(part.deductOverride===true)return {deduct:true,reason:'Counted manually (correction).'};
  if(part.deductOverride===false)return {deduct:false,reason:'Excluded manually (correction).'};
  if(part.attendance==='attended')return {deduct:true,reason:'Attended — counts as 1 session.'};
  if(part.attendance==='absent')return c.absenceRule==='deduct'?{deduct:true,reason:'Absent — this course deducts missed sessions.'}:{deduct:false,reason:'Absent — this course does not deduct missed sessions.'};
  return {deduct:false,reason:'Attendance not recorded yet.'};
}

/* Package ledger — derived, never stored as counters, so a session can never be deducted twice.
   Eligible sessions are walked in date order and poured into packages in number order. */
function ledger(pid,cid){
  const pk=S.packages.filter(p=>p.personId===pid&&p.courseId===cid).sort((a,b)=>a.number-b.number).map(p=>({...p,count:0,sessionIds:[]}));
  const uncovered=[];
  sessionsFor(pid,cid).filter(s=>s.status==='completed').sort(cmpSession).forEach(s=>{
    const d=shouldDeduct(s,partOf(s,pid));if(!d.deduct)return;
    const t=pk.find(p=>p.count<Math.max(0,p.size-(p.adjust||0))&&s.date>=p.coversFrom);
    if(t){t.count++;t.sessionIds.push(s.id)}else uncovered.push(s.id);
  });
  let activeSet=false;
  pk.forEach(p=>{
    p.used=p.count+(p.adjust||0);p.remaining=Math.max(0,p.size-p.used);p.completed=p.used>=p.size;
    const ds=p.sessionIds.map(i=>sess(i).date);
    p.firstDate=ds[0]||null;p.completedDate=p.completed?(ds[ds.length-1]||p.coversFrom):null;
    if(p.completed)p.status='completed';else if(!activeSet){p.status='active';activeSet=true}else p.status='queued';
  });
  const remaining=pk.filter(p=>!p.completed).reduce((a,p)=>a+p.remaining,0);
  return {packages:pk,uncovered,remaining,active:pk.find(p=>p.status==='active')||null,latest:pk[pk.length-1]||null};
}
function deductionInfo(s,pid){
  const part=partOf(s,pid);const d=shouldDeduct(s,part);if(!d.deduct)return {...d,pkg:null};
  const L=ledger(pid,s.courseId);const p=L.packages.find(x=>x.sessionIds.includes(s.id));
  if(!p)return {deduct:true,reason:d.reason+' No package covers it yet — payment needed.',pkg:null,unpaid:true};
  const pos=p.sessionIds.indexOf(s.id)+1+(p.adjust||0);
  return {deduct:true,reason:d.reason,pkg:p,pos};
}

/* Conflicts & buffers — checks Course-vs-Course, Course-vs-Event and Event-vs-Event per affected person */
const bufferNeeded=(a,b)=>Math.max(a.bufferMin||0,b.bufferMin||0);
function personBlocks(pid,date,excl=[]){
  const out=[];
  S.sessions.forEach(s=>{if(excl.includes(s.id)||s.date!==date||!BLOCKING.includes(s.status)||!partOf(s,pid))return;out.push({start:s.start,end:s.end,ref:s,kind:'session'})});
  S.events.forEach(e=>{if(excl.includes(e.id)||e.date!==date||e.status==='Cancelled'||!e.participants.includes(pid))return;out.push({start:e.start,end:e.end,buffer:e.bufferMin||0,ref:e,kind:'event'})});
  return out;
}
function findConflicts(pids,date,start,end,cid,excl=[]){
  const out=[],c=cid?course(cid):{bufferMin:0};const a1=tmin(start),a2=tmin(end);
  pids.forEach(pid=>{
    personBlocks(pid,date,excl).forEach(b=>{
      const b1=tmin(b.start),b2=tmin(b.end);
      const need=b.kind==='session'?bufferNeeded(c,course(b.ref.courseId)):Math.max(c.bufferMin||0,b.buffer||0);
      const gap=a1>=b2?a1-b2:(b1>=a2?b1-a2:-1);
      if(gap<0)out.push({type:'overlap',personId:pid,other:b.ref,otherKind:b.kind,need,gap:0});
      else if(gap<need)out.push({type:'buffer',personId:pid,other:b.ref,otherKind:b.kind,need,gap});
    });
  });
  return out;
}
function conflictLabel(x){return x.otherKind==='event'?esc(x.other.title):esc(course(x.other.courseId).name)}
function conflictText(x){
  const n=person(x.personId).name,lbl=conflictLabel(x);
  if(x.type==='overlap')return `<b>${esc(n)}</b> already has <b>${lbl}</b> ${fmtT(x.other.start)}–${fmtT(x.other.end)} at the same time.`;
  return `<b>${esc(n)}</b> has <b>${lbl}</b> ${fmtT(x.other.start)}–${fmtT(x.other.end)}. Only <b>${x.gap} min</b> between the two, but <b>${x.need} min</b> of travel/buffer is required.`;
}
function allConflicts(){
  const out=[],seen=new Set(),t=today();
  const items=[
    ...S.sessions.filter(s=>s.date>=t&&BLOCKING.includes(s.status)&&course(s.courseId)&&course(s.courseId).householdId===CH).map(s=>({id:s.id,date:s.date,start:s.start,end:s.end,pids:s.participants.map(p=>p.personId),cid:s.courseId})),
    ...S.events.filter(e=>e.date>=t&&e.status!=='Cancelled'&&e.householdId===CH).map(e=>({id:e.id,date:e.date,start:e.start,end:e.end,pids:e.participants,cid:null}))
  ].sort((a,b)=>a.date===b.date?a.start.localeCompare(b.start):a.date.localeCompare(b.date));
  items.forEach(it=>it.pids.forEach(pid=>{
    findConflicts([pid],it.date,it.start,it.end,it.cid,[it.id]).forEach(x=>{
      const k=[it.id,x.other.id].sort().join('|')+pid;if(seen.has(k))return;seen.add(k);
      out.push({personId:pid,a:it,b:x.other,aLabel:it.cid?course(it.cid).name:(S.events.find(e=>e.id===it.id)||{}).title,type:x.type,gap:x.gap,need:x.need,otherKind:x.otherKind});
    });
  }));
  return out.sort((x,y)=>x.a.date===y.a.date?x.a.start.localeCompare(y.a.start):x.a.date.localeCompare(y.a.date));
}

/* Recurring schedule → sessions */
function activeEnrollees(cid,date){return S.enrollments.filter(e=>e.courseId===cid&&e.active&&(!e.joinedOn||e.joinedOn<=date)).map(e=>e.personId).filter(id=>person(id)&&person(id).active!==false)}
function makeSession(c,sch,date){

function syncSessions(){
  const to=addDays(today(),S.settings.horizon||112),keys=new Set(S.sessions.map(s=>s.slotKey).filter(Boolean));
  S.schedules.forEach(sch=>{
    const c=course(sch.courseId);if(!c||c.status!=='Active')return;

    }
  });
}
const untouched=s=>s.status==='upcoming'&&!s.edited&&!s.rescheduledFromId&&s.participants.every(p=>!p.attendance)&&!s.covered&&!s.homework&&!s.notes&&!s.reminder;

/* Rescheduling — original keeps history, replacement carries the entitlement */
function doReschedule(id,w,reason,by){
  const o=sess(id);
  if(!o)return {err:'Session not found.'};
  if(o.status==='rescheduled'||o.replacedById)return {err:'This session was already rescheduled. Open the replacement session to move it again.'};
  if(o.status==='completed')return {err:'This session is marked completed. Reopen it (clear attendance) before rescheduling.'};
  const c=course(o.courseId),n=makeSession(c,null,w.date);
  n.start=w.start;n.end=w.end;n.participants=o.participants.map(p=>({personId:p.personId,attendance:null,deductOverride:null,homeworkDone:false}));
  n.edited=true;n.rescheduledFromId=o.id;n.rootId=o.rootId||o.id;n.locationName=o.locationName;n.covered='';
  S.sessions.push(n);
  o.origStatus=o.status;o.status='rescheduled';o.replacedById=n.id;o.needsMakeup=false;
  if(reason)o.cancelReason=o.cancelReason||reason;if(by)o.requestedBy=o.requestedBy||by;
  o.rescheduledOn=today();
  log('session',o.id,`Rescheduled from ${fmtD(o.date)} ${fmtT(o.start)} to ${fmtD(w.date)} ${fmtT(w.start)}${reason?' — '+reason:''}. Entitlement moved to the new session.`);
  log('session',n.id,`Created as replacement for ${fmtD(o.date)} (${course(o.courseId).name}).`);
  return {ok:true,session:n};
}

/* Projections */
function forecast(pid,cid){
  const c=course(cid);if(!isPaid(c))return null;
  const L=ledger(pid,cid),R=L.remaining;
  const fut=sessionsFor(pid,cid).filter(s=>s.status==='upcoming').sort(cmpSession);
  const f={personId:pid,courseId:cid,remaining:R,price:c.price,size:c.packageSize,renewals:[],noPackage:L.packages.length===0,uncovered:L.uncovered.length,active:L.active};
  f.level=R<=0?'due':R===1?'urgent':R===2?'soon':'ok';
  let idx;
  if(R<=0){f.dueNow=true;f.projectedDate=today();f.renewals.push({date:today(),due:true});idx=c.packageSize-1}
  else{idx=R-1;if(fut.length>=R){f.projectedDate=fut[R-1].date;f.lastSessionId=fut[R-1].id}else f.short=true}
  while(idx<fut.length&&idx>=0){if(!(R<=0&&idx===-1))f.renewals.push({date:fut[idx].date,due:false});idx+=c.packageSize}
  if(R<=0&&!f.renewals.length)f.renewals.push({date:today(),due:true});
  return f;
}
function allForecasts(){
  const out=[];
  S.enrollments.filter(e=>e.active).forEach(e=>{
    const c=course(e.courseId),p=person(e.personId);if(!c||!p||c.householdId!==CH||p.active===false||c.status!=='Active'||!isPaid(c))return;
    const f=forecast(e.personId,e.courseId);if(f)out.push(f);
  });
  return out.sort((a,b)=>(a.projectedDate||'9999').localeCompare(b.projectedDate||'9999'));
}
function cashflow(){
  const m={};
  const lim=addDays(today(),95);allForecasts().forEach(f=>f.renewals.filter(r=>r.date<=lim).forEach(r=>{const k=r.date.slice(0,7);(m[k]=m[k]||{total:0,items:[]});m[k].total+=f.price;m[k].items.push({f,date:r.date,due:r.due})}));
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
}

/* Payments */
function createPayment(o){
  const c=course(o.courseId),L=ledger(o.personId,o.courseId);
  const number=(L.packages.reduce((a,p)=>Math.max(a,p.number),0))+1;
  let coversFrom=o.coversFrom;
  if(!coversFrom){const uc=L.uncovered.map(i=>sess(i).date).sort();coversFrom=uc.length?uc[0]:o.date}
  const pay={id:uid('pay'),personId:o.personId,courseId:o.courseId,packageId:null,amount:+o.amount,date:o.date,sessions:+o.sessions,method:o.method,notes:o.notes||''};
  const pk={id:uid('pk'),personId:o.personId,courseId:o.courseId,number,size:+o.sessions,price:+o.amount,paidDate:o.date,coversFrom,adjust:0,paymentId:pay.id};

/* ---------------------------------------------------------------------
   TASKS — unified Homework/Task/Reminder system.
   Session homework is DERIVED (never double-stored): one task per completed
   session with homework text, keyed off that session+person, due on
   s.homeworkDue (or the next scheduled session, else +3 days). Status is
   computed, not written — Missing appears automatically once the due
   date/time passes without the task being marked Done.
   Prep tasks (from Events) and any standalone task live in S.tasks.
   --------------------------------------------------------------------- */
function nextSessionDate(cid,afterDate){
  const n=S.sessions.filter(s=>s.courseId===cid&&s.status==='upcoming'&&s.date>afterDate).sort(cmpSession)[0];

function taskStatus(t){
  if(t.done)return 'done';
  if(!t.due)return 'pending';
  if(t.due<today())return 'missing';
  if(t.due===today()&&t.dueTime&&tmin(t.dueTime)<=nowMin())return 'missing';
  return 'pending';
}
function homeworkTasks(pid,cid){

  });
}
function allTasksFor(pid){

function taskStats(list){

function rangeFor(preset,from,to){
  const t=today();
  if(preset==='7')return [addDays(t,-6),t];
  if(preset==='30')return [addDays(t,-29),t];
  if(preset==='month')return [t.slice(0,7)+'-01',t];
  if(preset==='prevmonth'){const end=addDays(t.slice(0,7)+'-01',-1);return [end.slice(0,7)+'-01',end]}

/* ---------------------------------------------------------------------
   FAMILY FREE TIME — days with no courses/events for the selected people
   --------------------------------------------------------------------- */
function isBusyDay(pid,date){
  if(S.sessions.some(s=>s.date===date&&BLOCKING.includes(s.status)&&partOf(s,pid)))return true;
  if(S.events.some(e=>e.date===date&&e.status!=='Cancelled'&&e.participants.includes(pid)))return true;
  return false;
}
function familyFreeWindows(pids,from,to){
  const days=[];let d=from;while(d<=to){days.push(d);d=addDays(d,1)}
  const free=days.filter(d=>pids.every(pid=>!isBusyDay(pid,d)));
  const windows=[];let cur=null;
  free.forEach(d=>{if(cur&&addDays(cur.to,1)===d)cur.to=d;else{cur={from:d,to:d};windows.push(cur)}});
  return windows.filter(w=>daysBetween(w.from,w.to)+1>=1);
}

/* ---------------------------------------------------------------------
   FAMILY CIRCLES — cross-household free/busy only, never raw calendar data
   --------------------------------------------------------------------- */
function myCircles(){return S.circles.filter(c=>c.households.some(h=>h.householdId===CH))}
function circleHH(circle,hid){return circle.households.find(h=>h.householdId===(hid||CH))}
function busyBlocks(pid,date){
  const out=[];
  S.sessions.forEach(s=>{if(s.date===date&&BLOCKING.includes(s.status)&&partOf(s,pid))out.push({start:s.start,end:s.end})});
  S.events.forEach(e=>{if(e.date===date&&e.status!=='Cancelled'&&e.participants.includes(pid))out.push({start:e.start,end:e.end})});
  return out.sort((a,b)=>a.start.localeCompare(b.start));
}
function freeGaps(pid,date,dayStart,dayEnd){
  const busy=busyBlocks(pid,date);let cursor=dayStart,out=[];
  busy.forEach(b=>{if(tmin(b.start)>tmin(cursor))out.push({start:cursor,end:b.start});if(tmin(b.end)>tmin(cursor))cursor=b.end});
  if(tmin(dayEnd)>tmin(cursor))out.push({start:cursor,end:dayEnd});
  return out;
}
function intersectGaps(a,b){
  const out=[];
  a.forEach(x=>b.forEach(y=>{const s=Math.max(tmin(x.start),tmin(y.start)),e=Math.min(tmin(x.end),tmin(y.end));if(e-s>0)out.push({start:minT(s),end:minT(e)})}));
  return out;
}
function findCommonTime(pids,date,dayStart,dayEnd,minDur){
  if(!pids.length)return [];
  let g=freeGaps(pids[0],date,dayStart,dayEnd);
  for(let i=1;i<pids.length;i++)g=intersectGaps(g,freeGaps(pids[i],date,dayStart,dayEnd));
  return g.filter(x=>tmin(x.end)-tmin(x.start)>=minDur);
}
function findCommonBreak(groups,from,to,minDays){
  // groups: array of {householdId, pids}. A day counts "free" for a household if every listed pid there is free.
  const days=[];let d=from;while(d<=to){days.push(d);d=addDays(d,1)}
  const perHH=groups.map(g=>({householdId:g.householdId,freeDays:new Set(days.filter(d=>g.pids.every(pid=>!isBusyDay(pid,d))))}));
  const out=[];let cur=null;
  days.forEach(d=>{
    const avail=perHH.filter(h=>h.freeDays.has(d)).length;
    if(avail>0){if(cur&&cur.to2===addDays(d,-1)&&cur.count===avail){cur.to=d;cur.to2=d}else{cur={from:d,to:d,to2:d,count:avail};out.push(cur)}}
    else cur=null;
  });
  return out.filter(w=>daysBetween(w.from,w.to)+1>=(minDays||1)).map(w=>({from:w.from,to:w.to,count:w.count,total:groups.length}));
}

/* ---- HOME ---- */
function viewHome(){
  const t=today(),tm=addDays(t,1),vs=visibleSessions();
  const on=d=>vs.filter(s=>s.date===d).sort(cmpSession);
  const todayL=on(t),tmL=on(tm);
  const wkEnd=addDays(t,7);
  const weekL=vs.filter(s=>s.date>tm&&s.date<=wkEnd&&s.status!=='rescheduled').sort(cmpSession);
  const dueCount=vs.filter(s=>isDue(s)&&visibleParts(s).some(p=>!p.attendance)).length;
  const active=todayL.filter(s=>!['rescheduled','cancelled_teacher','cancelled_family','pending_reschedule'].includes(s.status));
  let h=`<div class="hero"><div class="big">${fmtD(t,{weekday:'long'})}</div><div class="sub">${fmtD(t,{day:'numeric',month:'long',year:'numeric'})} · ${active.length?active.length+' session'+(active.length>1?'s':'')+' today':'nothing scheduled today'}${dueCount?` · <b style="color:var(--warn)">${dueCount} to log</b>`:''}</div></div>`;
  h+=quickActions();
  if(isTeacher())return h+viewHomeTeacher(vs);
  // top alerts
  if(isAdmin()){
    const urgent=allForecasts().filter(f=>f.level!=='ok');
    const first=allForecasts().find(f=>f.projectedDate);
    if(first)h+=`<div class="banner ${urgent.some(f=>f.level==='due')?'bad':'info'}">${ic('wallet',20)}<div><b>Next course payment: ${first.dueNow?'due now':'around '+fmtD(first.projectedDate,{weekday:'long',day:'numeric',month:'long'})}</b><br><span class="small">${esc(person(first.personId).name)} — ${esc(course(first.courseId).name)} · ${money(first.price)} · <i>projected from the remaining scheduled sessions</i></span></div></div>`;
  }
  h+=`<div class="grid g2">`;
  h+=sec('Today','clock',todayL.length?todayL.map(s=>sCard(s,{prep:true})).join(''):emptyMsg('Nothing today — enjoy the quiet.'));
  h+=sec('Tomorrow','calendar',tmL.length?tmL.map(s=>sCard(s,{prep:true})).join(''):emptyMsg('Nothing scheduled tomorrow.'));
  h+=`</div><div style="height:14px"></div><div class="grid g2">`;
  h+=sec('This week','calendar',weekL.length?groupByDate(weekL.slice(0,9),s=>sCard(s,{compact:false})):(hhCourses().length?emptyMsg('No more sessions in the next 7 days.'):NO_COURSES()),`<button class="btn sm" onclick="goTab('calendar')">Open calendar</button>`);
  h+=`<div class="grid">`;
  h+=homeworkCard(vs);
  h+=pendingCard(vs);
  h+=`</div></div><div style="height:14px"></div><div class="grid g2">`;

  h+=tasksCard();
  h+=`</div><div style="height:14px"></div><div class="grid g2">`;
  h+=feedbackCard();
  h+=eventsCard();

}

/* ---- SESSIONS ---- */
function sessFiltered(){
  const f=ui.sess;let l=visibleSessions();
  if(f.person!=='all')l=l.filter(s=>s.participants.some(p=>p.personId===f.person));
  if(f.course!=='all')l=l.filter(s=>s.courseId===f.course);
  if(f.teacher!=='all')l=l.filter(s=>course(s.courseId).teacherName===f.teacher);
  if(f.status!=='all')l=l.filter(s=>statusKey(s,f.person==='all'?null:f.person)===f.status);
  if(f.from)l=l.filter(s=>s.date>=f.from);if(f.to)l=l.filter(s=>s.date<=f.to);
  if(f.q){const q=f.q.toLowerCase();l=l.filter(s=>{const c=course(s.courseId);return (c.name+' '+c.teacherName+' '+s.participants.map(p=>person(p.personId).name).join(' ')+' '+s.covered+' '+s.homework+' '+s.notes).toLowerCase().includes(q)})}
  return l;
}

  <div class="row" style="margin-top:8px"><input type="text" placeholder="Search course, person, notes…" value="${esc(f.q)}" oninput="ui.sess.q=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const e=document.getElementById('qs');if(e){e.focus();e.setSelectionRange(9999,9999)}},350)" id="qs"><input type="date" value="${f.from}" onchange="setSess('from',this.value)" aria-label="From date"><input type="date" value="${f.to}" onchange="setSess('to',this.value)" aria-label="To date"></div></div>`;

function spendRange(){
  const f=ui.pay,t=today();
  if(f.range==='month')return [t.slice(0,7)+'-01',t];
  if(f.range==='prevmonth'){const end=addDays(t.slice(0,7)+'-01',-1);return [end.slice(0,7)+'-01',end]}
  if(f.range==='ytd')return [t.slice(0,4)+'-01-01',t];
  if(f.range==='custom')return [f.rfrom||t.slice(0,7)+'-01',f.rto||t];

}

function progressSummary(pid,cs){
  const f=ui.prog,isStudent=(person(pid)||{}).role==='member';

  const pct=att+ab?Math.round(att/(att+ab)*100):null;
  const fbs=S.feedback.filter(x=>x.personId===pid&&fbVisible(x)&&(f.course==='all'||sess(x.sessionId).courseId===f.course)).sort((a,b)=>b.createdOn.localeCompare(a.createdOn));
  const th=taskHistory(pid,addDays(today(),-29),today(),f.course,'all'),ts=taskStats(th);

  const months=[];for(let i=5;i>=0;i--){const d=parseD(today().slice(0,7)+'-01');d.setMonth(d.getMonth()-i);months.push(ymd(d).slice(0,7))}

function mark(sid,pid,val){
  const s=sess(sid),p=s&&partOf(s,pid);if(!p||!canMark(s,pid))return;
  if(['cancelled_teacher','cancelled_family','rescheduled','pending_reschedule'].includes(s.status)){toast('This session is '+ST[s.status][0].toLowerCase()+'. Reopen it before marking attendance.','warn');return}
  if(s.date>today()){toast('This session is in the future — attendance can be logged on the day.','warn');return}
  p.attendance=p.attendance===val?null:val;
  s.status=s.participants.some(x=>x.attendance)?'completed':'upcoming';
  log('session',s.id,`${person(pid).name} marked ${p.attendance||'no attendance'}.`);
  persist();refresh();
  if(!p.attendance)return toast('Attendance cleared');
  if(isAdmin()){const d=deductionInfo(s,pid);toast(`${person(pid).name}: ${val==='attended'?'Attended':'Absent'} — ${d.deduct?(d.pkg?`session ${d.pos} of ${d.pkg.size} used`:'counts, but no package covers it'):'not deducted'}`,d.unpaid?'warn':'')}
  else toast('Saved')
}

function setOverride(sid,pid,v){const p=partOf(sess(sid),pid);p.deductOverride=v==='auto'?null:v==='yes';log('session',sid,`Package count override for ${person(pid).name}: ${v}.`);persist();refresh()}

  let b=`<div class="small" style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px"><span>${ic('calendar',15)} ${fmtD(s.date,{weekday:'long',day:'numeric',month:'long'})}</span><span>${ic('clock',15)} ${fmtT(s.start)}–${fmtT(s.end)}</span><span>${ic(locIcon(c.locationType),15)} ${esc(locOf(s))}${c.locationType?` (${c.locationType})`:''}</span></div>${badge(s,parts.length===1?parts[0].personId:null)}`;
  if(s.rescheduledFromId){const o=sess(s.rescheduledFromId);if(o)b+=` <span class="badge st-res">Moved from ${fmtD(o.date)} ${fmtT(o.start)}</span>`}
  if(s.replacedById){const n=sess(s.replacedById);if(n)b+=` <button class="btn sm" onclick="openSession('${n.id}')">Replaced by ${fmtD(n.date)} ${fmtT(n.start)} →</button>`}
  b+=`<div style="margin-top:12px">`;
  if(cancelled){
    b+=`<div class="banner warn">${ic('alert',18)}<div>${s.status==='rescheduled'?'This session was rescheduled.':s.status==='pending_reschedule'?'Waiting for a new date.':'This session was cancelled.'}${s.cancelReason?` Reason: ${esc(s.cancelReason)}.`:''}${isAdmin()?' Nothing is deducted for this session.':''}</div></div>`;
  }
  const upPast=!cancelled;
  if(upPast)b+=`<h3 style="margin:8px 0 2px">Attendance</h3>${parts.map(p=>attRow(s,p)).join('')}${parts.length>1&&s.date<=today()?`<button class="btn sm" onclick="markAll('${s.id}')">Mark everyone attended</button>`:''}${s.date>today()?`<div class="tiny muted">Attendance can be logged on the day of the session.</div>`:''}`;
  if(isAdmin()&&upPast&&s.status==='completed'){
    b+=`<details class="dt"><summary>${ic('wallet',17)} Package impact</summary><div class="in">${parts.map(p=>{const d=deductionInfo(s,p.personId);return `<div style="padding:6px 0"><div class="b">${esc(person(p.personId).name)}</div><div class="small ${d.unpaid?'':'muted'}">${esc(d.reason)}${d.pkg?` <b>Package #${d.pkg.number} — ${d.pos} of ${d.pkg.size}.</b>`:''}</div>${isPaid(c)?`<div class="small" style="margin-top:4px">Correction: <select style="width:auto;padding:4px 8px" onchange="setOverride('${s.id}','${p.personId}',this.value)"><option value="auto" ${p.deductOverride==null?'selected':''}>Follow course rule</option><option value="yes" ${p.deductOverride===true?'selected':''}>Always count</option><option value="no" ${p.deductOverride===false?'selected':''}>Never count</option></select></div>`:''}</div>`}).join('')}</div></details>`;
  }else if(isAdmin()&&cancelled&&isPaid(c)){
    b+=`<details class="dt"><summary>${ic('wallet',17)} Package impact</summary><div class="in small">${esc(shouldDeduct(s,parts[0]||{}).reason)}</div></details>`;
  }
  // prep from last lesson
  if(s.status==='upcoming'){const items=parts.map(p=>({p,pr:prepFor(s,p.personId)})).filter(x=>x.pr&&(x.pr.homework||x.pr.reminder));
    if(items.length)b+=items.map(({p,pr})=>`<div class="prep" style="margin:10px 0">${parts.length>1?`<b>${esc(person(p.personId).name)}</b><br>`:''}${pr.homework?`<div><b>Homework from ${fmtD(pr.from.date)}:</b> ${esc(pr.homework)} ${pr.done?'✓':`<button class="btn sm" onclick="toggleHw('${pr.from.id}','${p.personId}')">Mark done</button>`}</div>`:''}${pr.reminder?`<div><b>Reminder:</b> ${esc(pr.reminder)}</div>`:''}</div>`).join('')}
  // notes
  const hasNotes=s.covered||s.homework||s.notes||s.reminder;
  b+=`<details class="dt" ${hasNotes?'open':''}><summary>${ic('note',17)} Lesson notes ${hasNotes?'<span class="badge">added</span>':'<span class="muted small b">optional</span>'}</summary><div class="in">
   <div class="fld"><label class="f">What we covered</label><textarea oninput="setField('${s.id}','covered',this.value)" placeholder="Topics or material covered">${esc(s.covered)}</textarea></div>
   <div class="fld"><label class="f">Homework / tasks for next lesson</label><textarea oninput="setField('${s.id}','homework',this.value)" placeholder="What to complete before next time">${esc(s.homework)}</textarea></div>
   <div class="fld"><label class="f">Reminder before next session</label><input type="text" value="${esc(s.reminder)}" oninput="setField('${s.id}','reminder',this.value)" placeholder="e.g. Review Chapter 3 before class"></div>
   ${isTeacher()?'':`<div class="fld"><label class="f">General notes ${isMember()?'':'(family only)'}</label><textarea oninput="setField('${s.id}','notes',this.value)">${esc(s.notes)}</textarea></div>`}</div></details>`;
  // feedback
  if(c.teacherAccess||S.feedback.some(f=>f.sessionId===s.id)){
    const fbParts=parts.filter(p=>isMember()?p.personId===V.id:true);
    const forms=fbParts.map(p=>{const f=S.feedback.find(x=>x.sessionId===s.id&&x.personId===p.personId);
      if(isMember()){return f&&f.shareWithStudent!==false?fbBlock(f):''}
      return fbForm(s,p.personId,f)}).join('');
    if(forms.trim())b+=`<details class="dt" ${S.feedback.some(f=>f.sessionId===s.id&&fbVisible(f))?'open':''}><summary>${ic('users',17)} Teacher feedback <span class="muted small b">${c.teacherAccess?esc(c.teacherName):'from '+esc(c.teacherName)}</span></summary><div class="in">${forms}</div></details>`;
  }
  // history
  const hist=S.audit.filter(a=>a.entityId===s.id).slice(-8).reverse();
  if(!isMember()&&!isTeacher()||true){
    const lines=[];
    if(s.rescheduledFromId){const o=sess(s.rescheduledFromId);if(o)lines.push(`Originally scheduled ${fmtD((sess(s.rootId||o.id)||o).date)} ${fmtT((sess(s.rootId||o.id)||o).start)}.`)}
    hist.forEach(a=>lines.push(`${fmtD(a.ts.slice(0,10),{day:'numeric',month:'short'})}: ${esc(a.text)}`));
    if(lines.length&&isAdmin())b+=`<details class="dt"><summary>${ic('clock',17)} History</summary><div class="in small">${lines.map(l=>`<div style="padding:3px 0">${l}</div>`).join('')}</div></details>`;
  }
  // actions
  b+=`</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">`;
  if(!cancelled&&canReschedule(s)&&!isTeacher())b+=`<button class="btn" onclick="openModal({type:'reschedule',id:'${s.id}'})">${ic('swap',16)} Reschedule</button>`;
  if(!cancelled&&!isTeacher())b+=`<button class="btn bad" onclick="openModal({type:'cancel',id:'${s.id}'})">Cancel session</button>`;
  if(isPending(s)&&canReschedule(s))b+=`<button class="btn pri" onclick="openModal({type:'reschedule',id:'${s.id}'})">${ic('swap',16)} Reschedule now</button>`;
  if(cancelled&&s.status!=='rescheduled'&&isAdmin())b+=`<button class="btn" onclick="reopen('${s.id}')">Reopen session</button>`;
  if(isAdmin()){b+=`<button class="btn" onclick="openModal({type:'editSession',id:'${s.id}'})">${ic('edit',16)} Edit this session</button>`;if(s.scheduleId)b+=`<button class="btn" onclick="openModal({type:'course',id:'${c.id}'})">${ic('calendar',16)} Edit recurring schedule</button>`}
  b+=`</div>`;
  return shell(`${esc(c.name)}`,b,false,parts.map(p=>esc(person(p.personId).name)).join(' & '));
}

/* ---- cancel / reschedule / edit / add session ---- */
function mCancel(m){
  const s=sess(m.id),c=course(s.courseId);
  const warn=s.status==='completed'?`<div class="banner warn">${ic('alert',18)}<div>This session is marked <b>${statusKey(s)==='completed_absent'?'absent':'attended'}</b>. Cancelling it will remove it from package counts and recalculate the remaining sessions.</div></div>`:'';
  return shell('Cancel session',`${warn}<p class="small muted">${esc(c.name)} · ${fmtD(s.date)} ${fmtT(s.start)}. Cancelled sessions are never deducted from a package.</p>
  <div class="fld"><label class="f">What happened?</label><select id="c-by">${isMember()?'':'<option value="teacher">Cancelled by teacher</option>'}<option value="family">Cancelled by student / family</option>${isMember()?'':''}<option value="postpone">Postponed — new date to be decided</option></select></div>
  <div class="fld"><label class="f">Reason (optional)</label><input type="text" id="c-reason" placeholder="e.g. Teacher unwell"></div>
  <label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" id="c-mk" checked> Needs a make-up session (adds it to Pending Reschedules)</label>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="openSession('${s.id}')">Back</button><button class="btn pri" onclick="doCancel('${s.id}')">Cancel session</button></div>`);
}
function doCancel(id){
  const s=sess(id),by=$('c-by').value,reason=$('c-reason').value.trim(),mk=$('c-mk').checked;
  s.cancelReason=reason;s.cancelledOn=today();
  if(by==='postpone'){s.status='pending_reschedule';s.needsMakeup=true;s.requestedBy=isMember()?'Student/Family':'Student/Family'}
  else{s.status=by==='teacher'?'cancelled_teacher':'cancelled_family';s.needsMakeup=mk;s.requestedBy=by==='teacher'?'Teacher':'Student/Family'}
  s.participants.forEach(p=>{if(s.status!=='completed')p.attendance=null});
  log('session',id,`${ST[s.status][0]}${reason?' — '+reason:''}. ${mk||by==='postpone'?'Make-up needed.':'No make-up.'} Not deducted.`);
  persist();openSession(id);refresh();toast('Session cancelled'+(s.needsMakeup?' — added to make-ups':''));
}
function whenFields(date,start,end){return `<div class="row"><div class="fld"><label class="f">Date</label><input type="date" id="f-date" value="${date}" onchange="liveCheck()"></div><div class="fld"><label class="f">Start</label><input type="time" id="f-start" value="${start}" onchange="liveCheck()"></div><div class="fld"><label class="f">End</label><input type="time" id="f-end" value="${end}" onchange="liveCheck()"></div></div><div id="conf-box"></div>`}
function mReschedule(m){
  const s=sess(m.id),c=course(s.courseId);
  const dur=tmin(s.end)-tmin(s.start),nd=s.date>=today()?addDays(s.date,1):addDays(today(),1);
  return shell('Reschedule session',`<p class="small muted">${esc(c.name)} · originally ${fmtD(s.date)} ${fmtT(s.start)}–${fmtT(s.end)}. The original is kept in the history and the package entitlement moves to the new session — nothing is deducted twice.</p>
  ${whenFields(nd,s.start,minT(tmin(s.start)+dur))}
  <div class="row"><div class="fld"><label class="f">Requested by</label><select id="r-by"><option>Teacher</option><option selected>Student/Family</option></select></div><div class="fld"><label class="f">Reason (optional)</label><input type="text" id="r-reason"></div></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap"><button class="btn" onclick="openSession('${s.id}')">Back</button><button class="btn pri" id="f-go" onclick="submitReschedule('${s.id}')">Reschedule</button></div>`);
}
function submitReschedule(id){
  const w=readWhen();if(!validWhen(w))return;
  const cf=liveCheck();if(cf&&!$('f-ov')?.checked&&cf.length)return;
  const r=doReschedule(id,w,$('r-reason').value.trim(),$('r-by').value);
  if(r.err){toast(r.err,'warn');return}
  persist();openSession(r.session.id);refresh();toast('Rescheduled — moved to '+fmtD(w.date)+' '+fmtT(w.start));
}
function readWhen(){return {date:$('f-date').value,start:$('f-start').value,end:$('f-end').value}}
function validWhen(w){if(!w.date||!w.start||!w.end){toast('Choose a date and times.','warn');return false}if(tmin(w.end)<=tmin(w.start)){toast('End time must be after the start time.','warn');return false}return true}
function liveCheck(){
  const m=ui.modal,box=$('conf-box');if(!m||!box)return null;const w=readWhen();
  let pids,cid,excl=[];
  if(m.type==='reschedule'||m.type==='editSession'){const s=sess(m.id);pids=s.participants.map(p=>p.personId);cid=s.courseId;excl=[s.id]}
  else if(m.type==='event'){pids=[...document.querySelectorAll('.ev-part:checked')].map(x=>x.value);cid=null;excl=m.id?[m.id]:[]}
  else{cid=$('f-course').value;pids=[...document.querySelectorAll('.f-part:checked')].map(x=>x.value)}
  const go=$('f-go');
  if(!w.date||!w.start||!w.end||tmin(w.end)<=tmin(w.start)||(m.type!=='event'&&!cid)||!pids.length){box.innerHTML='';if(go)go.disabled=!!(!w.date||tmin(w.end)<=tmin(w.start));return []}
  const cf=findConflicts(pids,w.date,w.start,w.end,cid,excl);
  if(!cf.length){box.innerHTML=`<div class="banner info" style="margin:0 0 12px">${ic('check',16)}<div class="small">No conflicts for ${pids.map(id=>esc(person(id).name)).join(' & ')}.</div></div>`;if(go)go.disabled=false;return []}
  box.innerHTML=`<div class="banner bad">${ic('alert',20)}<div><b>Schedule conflict — please choose another time</b><ul class="small">${cf.map(x=>`<li>${conflictText(x)}</li>`).join('')}</ul>${isAdmin()?`<label class="small" style="display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="f-ov" onchange="document.getElementById('f-go').disabled=!this.checked"> I understand — schedule anyway (admin)</label>`:''}</div></div>`;
  if(go)go.disabled=true;return cf;
}
function mEditSession(m){

function mAddSession(m){

function saveAddSession(){

/* ---- attendance list / pick reschedule / alerts / export ---- */

  const list=visibleSessions().filter(s=>s.status==='upcoming'&&s.date>=today()&&canReschedule(s)).sort(cmpSession).slice(0,12);

function mAlerts(){const n=buildNotifications();return shell('Alerts',n.length?`<div class="list">${n.map(x=>`<div class="li">${ic(x.icon,20)}<div class="grow small">${esc(x.text)}</div><span class="badge ${x.sev>=3?'st-bad':x.sev===2?'st-warn':'st-up'}">${x.sev>=3?'Now':x.sev===2?'Soon':'Heads-up'}</span></div>`).join('')}</div>`:'<div class="empty">All clear.</div>')}
function mExport(){return shell('Export data',`<p class="small muted">Copy this JSON to back up or move the data. It matches the structure a real database would use.</p><textarea style="min-height:240px;font-family:monospace;font-size:12px" readonly onclick="this.select()">${esc(JSON.stringify(S,null,1))}</textarea>`,true)}
function mPkgSessions(m){
  const L=ledger(m.personId,m.courseId),c=course(m.courseId);
  return shell(`${esc(person(m.personId).name)} — ${esc(c.name)}`,L.packages.map(p=>`<div class="dayh">Package #${p.number} <small>${p.used}/${p.size}</small></div>${p.sessionIds.map((id,i)=>{const s=sess(id),d=shouldDeduct(s,partOf(s,m.personId));return `<div class="li"><b style="width:26px">${i+1+(p.adjust||0)}</b><div class="grow small">${fmtD(s.date)} ${fmtT(s.start)}<div class="muted">${esc(d.reason)}</div></div></div>`}).join('')||'<div class="empty">No sessions counted yet.</div>'}${p.adjust?`<div class="small muted">Manual correction: ${p.adjust>0?'+':''}${p.adjust}${p.adjustReason?' — '+esc(p.adjustReason):''}</div>`:''}`).join('')+(L.uncovered.length?`<div class="banner bad">${L.uncovered.length} session(s) counted but not covered by any package.</div>`:''));
}

  return shell('Record payment',`<div class="row"><div class="fld"><label class="f">Person</label><select id="p-person" onchange="payPersonChanged()">${people.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="fld"><label class="f">Course</label><select id="p-course" onchange="payCourseChanged()"></select></div></div>

function payPersonChanged(){
  const pid=$('p-person').value;
  const cs=hhCourses().filter(c=>isPaid(c)&&(S.enrollments.some(e=>e.courseId===c.id&&e.personId===pid&&e.active)||S.packages.some(k=>k.courseId===c.id&&k.personId===pid)));
  const pre=ui.modal.courseId;
  $('p-course').innerHTML=cs.length?cs.map(c=>`<option value="${c.id}" ${pre===c.id?'selected':''}>${esc(c.name)}</option>`).join(''):'<option value="">No paid courses</option>';
  payCourseChanged();
}
function payCourseChanged(){const c=course($('p-course').value);if(c){$('p-amount').value=c.price;$('p-sessions').value=c.packageSize}payUpdate()}
function payUpdate(){
  if(!$('p-person'))return;if(!$('p-course').innerHTML)payPersonChanged();
  const pid=$('p-person').value,cid=$('p-course').value;if(!cid){$('p-info').innerHTML='';return}
  const L=ledger(pid,cid);let h='';
  if(L.remaining>0)h+=`<div class="banner warn">${ic('alert',18)}<div class="small">Package #${L.active.number} still has <b>${L.remaining}</b> session(s) left. This payment is saved as the next package and starts after those are used — nothing is overwritten.</div></div>`;
  if(L.uncovered.length)h+=`<div class="banner info">${ic('check',18)}<div class="small">${L.uncovered.length} attended session(s) are not yet covered; this payment will cover them first.</div></div>`;
  $('p-info').innerHTML=h;
}
function savePayment(){
  const cid=$('p-course').value,amt=+$('p-amount').value,ses=+$('p-sessions').value,date=$('p-date').value;
  if(!cid||!(amt>=0)||!(ses>0)||!date){toast('Fill in course, amount, sessions and date.','warn');return}
  const r=createPayment({personId:$('p-person').value,courseId:cid,amount:amt,sessions:ses,date,method:$('p-method').value,notes:$('p-notes').value});
  persist();closeModal();toast(r.queued?`Saved as Package #${r.pk.number} — starts after ${r.prevRemaining} remaining session(s)`:`Package #${r.pk.number} recorded`);
}
function confirmDeletePayment(id){confirmBox('Delete this payment?','Its package is removed too and session counts are recalculated. Attended sessions may become “not covered”.',`deletePayment('${id}')`)}
function deletePayment(id){const p=S.payments.find(x=>x.id===id);S.packages=S.packages.filter(k=>k.id!==p.packageId);S.payments=S.payments.filter(x=>x.id!==id);log('package',p.packageId,'Payment deleted.');persist();closeConfirm();render();toast('Payment deleted')}

function saveCourse(id,force){
  const name=$('c-name').value.trim();if(!name){toast('Please enter a course name.','warn');return}
  const pids=[...document.querySelectorAll('.c-en:checked')].map(x=>x.value);
  const rows=[...document.querySelectorAll('.sch-row')].map(r=>({days:[...r.querySelectorAll('.sd:checked')].map(x=>+x.value),start:r.querySelector('.ss').value,end:r.querySelector('.se').value})).filter(r=>r.days.length);
  const status=$('c-status').value;
  if(rows.some(r=>!r.start||!r.end||tmin(r.end)<=tmin(r.start))){toast('Each schedule needs an end time after its start.','warn');return}
  if(status==='Active'&&!rows.length){toast('Pick at least one weekday for the schedule.','warn');return}
  if(!pids.length){toast('Choose at least one person.','warn');return}
  const free=$('c-free').checked,bufV=$('c-buf').value==='custom'?(+$('c-buf-c').value||0):+$('c-buf').value;
  const c0=id?course(id):null,oldEn=c0?S.enrollments.filter(e=>e.courseId===id&&e.active).map(e=>e.personId):[];
  const added=pids.filter(p=>!oldEn.includes(p)),removed=oldEn.filter(p=>!pids.includes(p));
  if(!force){
    const w=[];
    // conflicts for recurring schedule (next 6 weeks) — for every enrolled person
    const oldIds=id?S.schedules.filter(s=>s.courseId===id).map(s=>s.id):[];
    const ignore=S.sessions.filter(s=>oldIds.includes(s.scheduleId)&&s.date>=today()&&untouched(s)).map(s=>s.id);
    const tmpC={id:id||'__new',bufferMin:bufV};
    const seen=new Set();
    if(status==='Active')rows.forEach(r=>{for(let i=0;i<42;i++){const d=addDays(today(),i);if(!r.days.includes(dow(d)))continue;
      const bk=course(id);const saved=id?bk.bufferMin:null;
      if(id)bk.bufferMin=bufV;
      const cf=id?findConflicts(pids,d,r.start,r.end,id,ignore):findConflictsTmp(pids,d,r.start,r.end,bufV,ignore);
      if(id)bk.bufferMin=saved;
      cf.forEach(x=>{const k=x.personId+d+x.other.id;if(seen.has(k))return;seen.add(k);w.push(`${fmtD(d)}: ${conflictText(x)}`)})}});
    removed.forEach(p=>{if(c0&&isPaid(c0)){const L=ledger(p,id);if(L.remaining>0)w.push(`<b>${esc(person(p).name)}</b> leaves with ${L.remaining} session(s) left in the current package. The package history is kept, but no future sessions are scheduled for them.`)}});
    if(w.length){
      $('c-warn').innerHTML=`<div class="banner bad">${ic('alert',20)}<div><b>Please review before saving</b><ul class="small">${w.slice(0,6).map(x=>`<li>${x}</li>`).join('')}${w.length>6?`<li>…and ${w.length-6} more</li>`:''}</ul><button class="btn sm" style="margin-top:6px" onclick="saveCourse('${id}',true)">Save anyway</button></div></div>`;
      $('c-warn').scrollIntoView({block:'center'});return;
    }
  }
  let c=c0;
  const data={name,category:$('c-cat').value.trim()||'General',teacherName:$('c-teacher').value.trim(),teacherPhone:$('c-phone').value.trim(),locationName:$('c-loc').value.trim(),locationType:$('c-lt').value,address:$('c-addr').value.trim(),bufferMin:bufV,status,free,packageSize:free?0:(+$('c-size').value||1),price:free?0:(+$('c-price').value||0),absenceRule:$('c-abs').value,currency:cur(),notes:$('c-notes').value.trim(),memberCanReschedule:$('c-mr').checked};
  if(!c){c={id:uid('c'),teacherId:null,teacherAccess:false,householdId:CH};S.courses.push(c)}
  Object.assign(c,data);
  const ta=$('c-ta').value==='1'&&!!c.teacherName;
  if(ta){let t=S.teachers.find(t=>t.name.toLowerCase()===c.teacherName.toLowerCase());if(!t){t={id:uid('t'),name:c.teacherName,phone:c.teacherPhone};S.teachers.push(t)}c.teacherId=t.id}
  c.teacherAccess=ta;
  // schedules: purge future untouched, then rebuild
  const old=S.schedules.filter(s=>s.courseId===c.id);purgeFuture(old.map(s=>s.id));
  S.schedules=S.schedules.filter(s=>s.courseId!==c.id);
  const t0=today();
  rows.forEach((r,i)=>S.schedules.push({id:old[i]?old[i].id:uid('sc'),courseId:c.id,days:r.days,start:r.start,end:r.end,effectiveFrom:old[i]?old[i].effectiveFrom:t0}));
  // enrollments
  added.forEach(p=>{const ex=S.enrollments.find(e=>e.courseId===c.id&&e.personId===p);if(ex){ex.active=true;ex.joinedOn=t0}else S.enrollments.push({id:uid('e'),courseId:c.id,personId:p,active:true,teacherAccess:true,joinedOn:t0});
    S.sessions.filter(s=>s.courseId===c.id&&s.date>=t0&&s.status==='upcoming'&&!partOf(s,p)).forEach(s=>s.participants.push({personId:p,attendance:null,deductOverride:null,homeworkDone:false}))});
  removed.forEach(p=>{const e=S.enrollments.find(e=>e.courseId===c.id&&e.personId===p&&e.active);if(e){e.active=false;e.leftOn=t0}
    S.sessions.forEach(s=>{if(s.courseId===c.id&&s.date>=t0&&s.status==='upcoming')s.participants=s.participants.filter(x=>x.personId!==p||x.attendance)});
    S.sessions=S.sessions.filter(s=>!(s.courseId===c.id&&s.date>=t0&&s.status==='upcoming'&&!s.participants.length));log('course',c.id,`${person(p).name} left the course.`)});
  if(status!=='Active')purgeFuture(S.schedules.filter(s=>s.courseId===c.id).map(s=>s.id));
  syncSessions();log('course',c.id,id?'Course updated.':'Course created.');persist();closeModal();toast(id?'Course saved — future sessions updated':'Course added');
}

function saveEvent(id){
  const w=readWhen();if(!validWhen(w))return;

/* ---------------------------------------------------------------------
   DEMO DATA UPGRADE. Saved browser data wins over new seed data, so demo
   fixes shipped after a tester's first visit never reached them. Each fix
   below only touches records that exactly match the original demo seed,
   and runs once (S.demoVersion). Anything a tester created is left alone.
   --------------------------------------------------------------------- */
const DEMO_VERSION=3;
function upgradeDemo(){
  const from=S.demoVersion||0;if(from>=DEMO_VERSION)return [];
  const done=[],hasHala=!!S.households.find(h=>h.id==='hh_hala');
  if(hasHala){
    // a) Old placeholder holidays: seeded with demo:true AND a name ending "(demo)".
    const before=S.holidays.length;
    S.holidays=S.holidays.filter(h=>!(h.householdId==='hh_hala'&&h.demo===true&&/\(demo\)$/.test(h.name||'')));
    if(S.holidays.length<before)done.push(`removed ${before-S.holidays.length} placeholder holidays`);
    S.holidays.forEach(h=>{if(h.demo===true&&!h.status)h.status='manual';delete h.demo});
    const has=(n,d)=>S.holidays.some(h=>h.householdId==='hh_hala'&&h.name===n&&h.date===d);
    const add=egyptHolidays2026('hh_hala').filter(h=>!has(h.name,h.date));
    if(add.length){S.holidays.push(...add);done.push(`added ${add.length} Egypt 2026 holidays`)}
    // b) German Course Group: add if missing and all demo members still exist.
    const need=['p_yara','p_adam','p_layla'].every(id=>person(id));
    if(!S.teachers.some(t=>t.id==='t_petra'))S.teachers.push({id:'t_petra',name:'Ms. Petra Lange',phone:'+20 122 555 0110'});
    let g=S.courseGroups.find(x=>x.id==='cg_german');
    if(!g&&need){g=seedGermanGroup();S.courseGroups.push(g);done.push('added German Course Group')}
    // c) Schedule Update label on the seeded announcement.
    if(g)g.announcements.forEach(a=>{if(a.title==="Tomorrow's class moved to 6 PM"&&a.author==='Ms. Petra Lange'&&!a.kind){a.kind='schedule';done.push('labelled schedule update')}});
    // d) Duplicate event preparation tasks (same event + same title): keep one, preferring the organising adult.
    const seen={};const role=pid=>(person(pid)||{}).role;
    [...S.tasks].sort((a,b)=>(['admin','parent'].includes(role(b.personId))?1:0)-(['admin','parent'].includes(role(a.personId))?1:0)).forEach(t=>{
      if(t.kind!=='prep'||!t.eventId)return;const k=t.eventId+'|'+t.title;
      if(seen[k]){if(!seen[k].done&&t.done)seen[k].done=true;t._dup=true}else seen[k]=t;
    });
    const n0=S.tasks.length;S.tasks=S.tasks.filter(t=>!t._dup);if(S.tasks.length<n0)done.push(`merged ${n0-S.tasks.length} duplicate preparation tasks`);
    // e) Circle participants: only if still exactly the original seed value.
    const c=S.circles.find(x=>x.id==='cir_friends'),me=c&&c.households.find(h=>h.householdId==='hh_hala');
    if(me&&JSON.stringify(me.participants)===JSON.stringify(['p_hala','p_yara','p_karma'])){me.participants=['p_yara','p_karma'];done.push('updated circle participants')}
  }
  S.demoVersion=DEMO_VERSION;
  if(done.length)log('system','system','Demo data upgraded to v'+DEMO_VERSION+': '+done.join('; ')+'.');
  return done;
}

/* Saves Steps 1–3. First call creates the household (so Steps 4–5 can use the real School
   and Course data); later calls — after Back or Edit — update it in place. */
function commitHousehold(){
  const creating=!S;
  if(creating){
    const hid='hh_'+Date.now().toString(36)+rnd();
    S={seq:1,households:[],people:[],accounts:[],teachers:[],courses:[],enrollments:[],schedules:[],sessions:[],packages:[],payments:[],feedback:[],audit:[],
       settings:{horizon:112,weekStart:0},tasks:[],events:[],schoolCalendars:[],schoolImports:[],holidays:[],circles:[],sharedPlans:[],courseGroups:[],protoFeedback:[],
       helpSeen:false,demoVersion:DEMO_VERSION,mode:'real',onboarding:{active:true,step:3,school:{}}};
    CH=hid;S.households.push({id:hid,createdOn:today()});
  }
  const h=household(),hid=h.id;
  Object.assign(h,{name:onb.hh.name,country:onb.hh.country,currency:onb.hh.currency});
  S.settings.weekStart=onb.hh.weekStart;
  // holidays follow the country: Egypt gets the built-in 2026 list; built-in entries go if the country changes
  const builtIn=S.holidays.filter(x=>x.householdId===hid&&x.status!=='manual');
  if(onb.hh.country==='Egypt'&&!builtIn.length)S.holidays.push(...egyptHolidays2026(hid));
  if(onb.hh.country!=='Egypt')S.holidays=S.holidays.filter(x=>!(x.householdId===hid&&x.status!=='manual'));
  // you: first User Account ↔ Person Profile
  let me=onb.me.id&&person(onb.me.id);
  if(!me){me={id:uid('p'),role:'admin',active:true,householdId:hid};S.people.push(me);onb.me.id=me.id;
    S.accounts.push({id:uid('acct'),personId:me.id,householdId:hid,role:'admin',createdOn:today()})}
  Object.assign(me,{name:onb.me.name,color:onb.me.color||PALETTE[0],relationship:onb.me.relationship});
  // family members
  const used=[me.color],keep=new Set([me.id]);
  onb.members.forEach(m=>{
    const color=m.color&&!used.includes(m.color)?m.color:nextColor(used);used.push(color);m.color=color;
    let p=m.id&&person(m.id);
    if(!p){p={id:uid('p'),active:true,householdId:hid};S.people.push(p);m.id=p.id}
    Object.assign(p,{name:m.name,color,memberType:m.type,role:m.type==='parent'?'parent':'member',
      relationship:m.relationship||(m.type==='other'?'Family member':'')});
    if(m.type!=='parent'){delete p.childrenAccess;delete p.financeAccess}
    keep.add(p.id);
  });
  hhPeople(hid).filter(p=>!keep.has(p.id)).forEach(p=>removePersonData(p.id));
  const kids=hhPeople(hid).filter(p=>p.memberType==='child').map(p=>p.id);
  hhPeople(hid).filter(p=>p.memberType==='parent').forEach(p=>{p.childrenAccess=kids.slice();if(p.financeAccess===undefined)p.financeAccess=false});
  V={kind:'admin',id:me.id};
  log('system',hid,creating?`Household "${h.name}" created by ${me.name} with ${onb.members.length} family member(s).`:`Household setup updated.`);
  persist();
}
